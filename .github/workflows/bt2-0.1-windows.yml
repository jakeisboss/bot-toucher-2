name: BT2 0.1 Windows validation
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish requested 0.1 Release assets only after Windows checks pass'
        type: boolean
        default: false
  push:
    branches: [bt2-0.1-foundation, bt2-0.1.2-refinements]
    paths: [.github/bt2-0.1-windows-validation-request.json]
concurrency:
  group: bt2-0.1-explicit-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      publish_release: ${{ steps.request.outputs.publish_release }}
      version: ${{ steps.request.outputs.version }}
      previous_tag: ${{ steps.request.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Read explicit validation request
        id: request
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish_release }}
        run: |
          $publish = 'false'
          $version = '0.1.2'
          $previousTag = 'v0.1.1'
          if ($env:EVENT_NAME -eq 'push') {
            $request = Get-Content -Raw .github/bt2-0.1-windows-validation-request.json | ConvertFrom-Json
            $version = [string]$request.Version
            $previousTag = [string]$request.PreviousTag
            if ($request.PublishRelease -eq $true) { $publish = 'true' }
          } elseif ($env:MANUAL_PUBLISH -eq 'true') { $publish = 'true' }
          if ($version -ne '0.1.2' -or $previousTag -ne 'v0.1.1') { throw 'Only the requested 0.1.1 to 0.1.2 refinement release is supported' }
          "publish_release=$publish" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "previous_tag=$previousTag" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.428'
      - name: Targeted tests and WPF smoke
        shell: pwsh
        run: ./tools/check-windows.ps1
      - name: Actual disposable update rollback reapply
        shell: pwsh
        run: ./tools/test-update-windows.ps1
      - name: Public release index check without payload download
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP ('BT2-index-check-' + [Guid]::NewGuid().ToString('N'))
          dotnet run --project src/BotToucher2.Updater -c Release --no-build -- check --root $probe
          if ($LASTEXITCODE -ne 0) { throw 'Public release metadata check failed' }
  publish:
    if: ${{ needs.windows.outputs.publish_release == 'true' }}
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.428'
      - name: Publish explicit GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT2_RELEASE_VERSION: ${{ needs.windows.outputs.version }}
          BT2_PREVIOUS_TAG: ${{ needs.windows.outputs.previous_tag }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'BT2-published-source'
          New-Item -ItemType Directory $source | Out-Null
          gh release download $env:BT2_PREVIOUS_TAG --repo jakeisboss/bot-toucher-2 --pattern transition-initial.json --dir $source
          if ($LASTEXITCODE -ne 0) { throw 'Could not download exact published source manifest' }
          ./tools/publish-release.ps1 -Version $env:BT2_RELEASE_VERSION -PreviousManifest (Join-Path $source 'transition-initial.json')
      - name: Real public metadata check without payload download
        shell: pwsh
        run: |
          $updater = Get-ChildItem artifacts -Filter BotToucher2.Updater.exe -Recurse | Where-Object { $_.FullName -match '[\\/]engine[\\/]' } | Select-Object -First 1
          if (-not $updater) { throw 'Published helper not found' }
          $probe = Join-Path $env:RUNNER_TEMP ('BT2-public-check-' + [Guid]::NewGuid().ToString('N'))
          $found = $false
          for ($attempt = 0; $attempt -lt 6; $attempt++) {
            $result = & $updater.FullName check --root $probe
            if ($LASTEXITCODE -eq 0 -and ($result -join '') -match '0.1.2') { $found = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $found) { throw 'Published public release metadata did not become readable' }
      - name: Exact published source update rollback reapply
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $updater = Get-ChildItem artifacts -Filter BotToucher2.Updater.exe -Recurse | Where-Object { $_.FullName -match '[\\/]engine[\\/]' } | Select-Object -First 1
          ./tools/test-published-update-windows.ps1 -Updater $updater.FullName
